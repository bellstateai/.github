name: Bug report
description: Something behaves differently from how it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw.  Paste the error or the output if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The shortest sequence that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: Which repository, and which branch, deploy or environment.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What you have already ruled out is as useful as what you have seen.
    validations:
      required: false
